# Crea una release a ogni push su main che tocca pilauncher/.
# Versione: vX.Y.N, con X.Y letto da pilauncher/VERSION e N incrementato automaticamente.
name: Release

on:
  push:
    branches: [main]
    paths:
      - "pilauncher/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Controllo sintassi
        run: python3 -m py_compile $(find pilauncher -name '*.py')

      - name: Calcola versione
        id: ver
        run: |
          base="$(tr -d ' \r\n' < pilauncher/VERSION)"
          last="$(git tag -l "v${base}.*" --sort=-v:refname | head -n1)"
          if [ -z "$last" ]; then n=0; else n=$(( ${last##*.} + 1 )); fi
          echo "tag=v${base}.${n}" >> "$GITHUB_OUTPUT"

      - name: Crea pacchetto
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          mkdir -p build dist
          cp -r pilauncher build/pilauncher
          find build -name '__pycache__' -prune -exec rm -rf {} +
          rm -f build/pilauncher/config.json build/pilauncher/calib.json
          echo "$TAG" > build/pilauncher/VERSION
          tar -czf "dist/pilauncher-$TAG.tar.gz" -C build/pilauncher .
          cd dist && sha256sum "pilauncher-$TAG.tar.gz" > "pilauncher-$TAG.tar.gz.sha256"

      - name: Pubblica release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          gh release create "$TAG" dist/* \
            --target "$GITHUB_SHA" \
            --title "PiLauncher $TAG" \
            --generate-notes
